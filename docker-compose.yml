services:
  api:
    build: ./backend
    ports:
      - "8010:8010"
    volumes:
      # Everything that must survive a rebuild: the SQLite database and every
      # uploaded document. Keep this directory backed up -- it is the system
      # of record.
      - ./data:/data
    environment:
      # Add the deployed frontend origin once it exists.
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      # Vercel preview deployments get a new subdomain each time.
      CORS_ORIGIN_REGEX: "https://.*\\.vercel\\.app"
      # Override for anything beyond a local demo.
      SECRET_KEY: "dev-secret-not-for-production"
    restart: unless-stopped

  # Gives the laptop a public HTTPS address so a hosted frontend can reach it.
  # Quick tunnels need no Cloudflare account, but the URL changes every restart.
  # Read the CURRENT one from the newest connection, not from a plain grep --
  # the logs accumulate across restarts and a bare grep returns dead hostnames:
  #   docker compose logs --tail 60 tunnel | grep -B4 "Registered tunnel connection"
  tunnel:
    image: cloudflare/cloudflared:latest
    # --protocol http2: this network blocks or throttles UDP, so the default
    # QUIC transport never completes its handshake with Cloudflare's edge.
    command: tunnel --no-autoupdate --protocol http2 --url http://api:8010
    depends_on:
      - api
    restart: unless-stopped
