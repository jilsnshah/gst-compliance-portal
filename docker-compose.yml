# Office deployment: both containers on the firm's own server, data on the
# host. Nothing here reaches the internet.
#
#   cp .env.example .env     # then edit it -- SECRET_KEY and ADMIN_PASSWORD
#   docker compose up -d --build
#   open http://<server-ip>/ from any machine on the network

services:
  api:
    build: ./backend
    restart: unless-stopped
    volumes:
      # The database and every uploaded document. This directory IS the firm's
      # record -- back it up (see backup.sh).
      - ./data:/data
    environment:
      # Signs every login token. Change it once, keep it secret; changing it
      # later signs everyone out.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # Used only to create the first administrator on an empty database.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@firm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # true = load admin@test.com / client@test.com and the sample workbooks.
      # Leave false on the office server.
      SEED_DEMO: ${SEED_DEMO:-false}
      # Same-origin through nginx, so no browser origin to allow.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Port 80 on the server: staff open http://<server-ip>/
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
