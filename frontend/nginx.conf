server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Purchase registers and attachments; the API caps attachments at 10 MB.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reconciliation on a large register can take a while.
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8010/health;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed, so it can be cached hard; index.html must
    # not be, or browsers keep loading yesterday's app after an update.
    location ~* \.(js|css|woff2?|png|svg|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
